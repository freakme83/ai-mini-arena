<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arena Observer</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <!-- Top HUD -->
    <div class="hud">
      <div class="hud-fighter hud-left">
        <div class="hud-name" id="left-name">Fighter 1</div>
        <div class="hud-bars">
          <div class="hud-bar-row">
            <span class="hud-bar-label">HP</span>
            <div class="hud-bar hp-bar"><div id="left-hp-fill" class="hud-fill hp-fill"></div></div>
            <span class="hud-bar-value" id="left-hp-val">100</span>
          </div>
          <div class="hud-bar-row">
            <span class="hud-bar-label">ST</span>
            <div class="hud-bar st-bar"><div id="left-st-fill" class="hud-fill st-fill"></div></div>
            <span class="hud-bar-value" id="left-st-val">100</span>
          </div>
        </div>
      </div>
      <div class="hud-center">
        <div class="hud-round" id="round-display">ROUND 1</div>
        <div class="hud-vs">VS</div>
      </div>
      <div class="hud-fighter hud-right">
        <div class="hud-name" id="right-name">Fighter 2</div>
        <div class="hud-bars">
          <div class="hud-bar-row">
            <span class="hud-bar-label">HP</span>
            <div class="hud-bar hp-bar"><div id="right-hp-fill" class="hud-fill hp-fill"></div></div>
            <span class="hud-bar-value" id="right-hp-val">100</span>
          </div>
          <div class="hud-bar-row">
            <span class="hud-bar-label">ST</span>
            <div class="hud-bar st-bar"><div id="right-st-fill" class="hud-fill st-fill"></div></div>
            <span class="hud-bar-value" id="right-st-val">100</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Arena Stage -->
    <div class="arena" id="arena">
      <div class="arena-floor"></div>

      <!-- Impact / event effects -->
      <div class="impact-text" id="impact-text"></div>

      <!-- Left Fighter -->
      <div class="fighter" id="fighter-left">
        <div class="fighter-body">
          <div class="head"></div>
          <div class="torso"></div>
          <div class="arm arm-lead"></div>
          <div class="arm arm-rear"></div>
          <div class="leg leg-lead"></div>
          <div class="leg leg-rear"></div>
          <!-- Shield (visible on block) -->
          <div class="shield"></div>
          <!-- Weapon glow for attacks -->
          <div class="attack-fx"></div>
        </div>
        <div class="fighter-shadow"></div>
      </div>

      <!-- Right Fighter -->
      <div class="fighter flipped" id="fighter-right">
        <div class="fighter-body">
          <div class="head"></div>
          <div class="torso"></div>
          <div class="arm arm-lead"></div>
          <div class="arm arm-rear"></div>
          <div class="leg leg-lead"></div>
          <div class="leg leg-rear"></div>
          <div class="shield"></div>
          <div class="attack-fx"></div>
        </div>
        <div class="fighter-shadow"></div>
      </div>

      <!-- Contact spark at impact point -->
      <div class="contact-spark" id="contact-spark">
        <div class="spark-core"></div>
        <div class="spark-ring"></div>
      </div>

      <!-- Damage numbers -->
      <div class="damage-popup" id="dmg-left"></div>
      <div class="damage-popup" id="dmg-right"></div>
    </div>

    <!-- Bottom bar: summary + controls -->
    <div class="bottom-bar">
      <div class="summary-text" id="summary">Awaiting match data...</div>
      <div class="event-tags" id="event-tags"></div>
      <div class="controls">
        <button id="btn-prev" title="Previous step">&laquo; Prev</button>
        <button id="btn-play" title="Auto-play">Play</button>
        <button id="btn-next" title="Next step">Next &raquo;</button>
        <button id="btn-reset" title="Reset">Reset</button>
        <span class="step-info" id="step-info">0 / 0</span>
        <label class="speed-label">
          Speed
          <input type="range" id="speed-slider" min="400" max="2500" value="1200" step="100" />
        </label>
      </div>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
